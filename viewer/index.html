<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kratib 3DGS viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd;
    font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
  #drop {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    padding: 24px; z-index: 10;
  }
  #drop.hidden { display: none; }
  #drop h1 { font-size: 18px; font-weight: 600; margin: 0; }
  #drop p { margin: 0; opacity: .7; max-width: 30rem; }
  #drop label {
    border: 1px solid #555; border-radius: 8px; padding: 10px 18px;
    cursor: pointer; background: #1c1c1c;
  }
  #drop label:hover { background: #262626; }
  #drop input { display: none; }
  #err { color: #ff6b6b; white-space: pre-wrap; }
  #hint { position: absolute; left: 12px; bottom: 10px; opacity: .55;
    z-index: 10; pointer-events: none; }
</style>
</head>
<body>
<div id="drop">
  <h1>kratib 3D Gaussian Splatting viewer</h1>
  <p>Drop a <code>.ply</code> (from <code>ns-export gaussian-splat</code>),
     or a <code>.splat</code> / <code>.ksplat</code> file here.</p>
  <label>Choose file<input id="file" type="file" accept=".ply,.splat,.ksplat" /></label>
  <p id="err"></p>
</div>
<div id="hint">drag = orbit &nbsp;·&nbsp; scroll = zoom &nbsp;·&nbsp; right-drag = pan</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
  }
}
</script>
<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const drop = document.getElementById('drop');
const err  = document.getElementById('err');
let viewer = null;

function fmtFor(name) {
  const n = name.toLowerCase();
  if (n.endsWith('.ply'))    return GaussianSplats3D.SceneFormat.Ply;
  if (n.endsWith('.splat'))  return GaussianSplats3D.SceneFormat.Splat;
  if (n.endsWith('.ksplat')) return GaussianSplats3D.SceneFormat.KSplat;
  return null;
}

async function load(file) {
  const format = fmtFor(file.name);
  if (format === null) { err.textContent = 'Unsupported file: ' + file.name; return; }
  err.textContent = 'Loading ' + file.name + ' …';

  if (viewer) { try { await viewer.dispose(); } catch (e) {} viewer = null; }

  viewer = new GaussianSplats3D.Viewer({
    cameraUp: [0, -1, 0],                 // COLMAP / nerfstudio convention
    initialCameraPosition: [0, 0, -4],
    initialCameraLookAt: [0, 0, 0],
    sharedMemoryForWorkers: false,        // works without COOP/COEP headers
    dynamicScene: false,
  });

  const url = URL.createObjectURL(file);
  try {
    await viewer.addSplatScene(url, { format, showLoadingUI: true, progressiveLoad: true });
    viewer.start();
    drop.classList.add('hidden');
  } catch (e) {
    err.textContent = 'Failed to load:\n' + (e && e.message ? e.message : e);
    console.error(e);
  } finally {
    URL.revokeObjectURL(url);
  }
}

document.getElementById('file').addEventListener('change', e => {
  if (e.target.files[0]) load(e.target.files[0]);
});
['dragover', 'drop'].forEach(t => window.addEventListener(t, e => e.preventDefault()));
window.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (f) load(f);
});
</script>
</body>
</html>
